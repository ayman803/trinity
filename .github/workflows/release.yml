# Publish a release of Trinity: Windows and Linux builds for modern
# processors (x86-64-v3: AVX2, about 2013 onwards) and older ones
# (x86-64-v2), attached to a GitHub release. Started by hand:
# Actions tab -> "Release" -> "Run workflow", with the version number that
# Cargo.toml already carries. The release is made as a draft (visible only
# to the owner) so the files can be checked before it is made public.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, the same as in Cargo.toml (for example 1.0.0)"
        required: true
      commit:
        description: "Commit that was measured (for 1.1: 47a89f927e); the release stops if the branch now points elsewhere. Empty = no check"
        default: ""
      bench:
        description: "Bench node count that was measured (for 1.1: 916512); the release stops if a build differs. Empty = no check"
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.cpu }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: windows-latest, cpu: x86-64-v3, suffix: windows-x86-64-v3.exe }
          - { os: windows-latest, cpu: x86-64-v2, suffix: windows-x86-64-v2.exe }
          - { os: ubuntu-latest, cpu: x86-64-v3, suffix: linux-x86-64-v3 }
          - { os: ubuntu-latest, cpu: x86-64-v2, suffix: linux-x86-64-v2 }
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
      BENCH: ${{ inputs.bench }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check this is the measured commit
        if: inputs.commit != ''
        shell: bash
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]] || { echo "Commit must be a commit id"; exit 1; }
          head=$(git rev-parse HEAD)
          [[ "$head" == "$COMMIT"* ]] || { echo "STOP: the branch points at $head, not the measured commit $COMMIT"; exit 1; }
      - name: Check the version number
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.0.0"; exit 1; }
          grep -q "^version = \"$VERSION\"" Cargo.toml || { echo "Cargo.toml does not say version $VERSION"; exit 1; }
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
        run: |
          cargo build --release
          exe=target/release/trinity; [ -f "$exe.exe" ] && exe="$exe.exe"
          out="trinity-$VERSION-${{ matrix.suffix }}"
          cp "$exe" "$out"
          nodes=$(./$out bench | tail -1 | awk '{print $1}')
          echo "bench: $nodes nodes"
          if [ -n "$BENCH" ] && [ "$nodes" != "$BENCH" ]; then echo "STOP: bench $nodes differs from the measured $BENCH"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: trinity-${{ matrix.suffix }}
          path: trinity-${{ inputs.version }}-${{ matrix.suffix }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create the release
        run: |
          linux=$(ls files/*linux-x86-64-v2)
          chmod +x files/*linux*
          bench=$("$linux" bench | tail -1 | awk '{print $1}')
          cat > notes.md <<'EOF'
          Trinity VERSION, a UCI chess engine with an NNUE evaluation (see README.md).

          - Network: (768x8 king buckets -> 1024)x2 -> 8 output buckets, trained from scratch on Leela-derived data.
          - UCI options: `Hash` (MB, default 16), `Threads` (default 1; scaling tested with 4 threads, see test-results/), `Move Overhead` (ms), `SyzygyPath` (Syzygy tablebases).
          - Bench: BENCH nodes.
          - Checks against copying: a move-similarity test and a source comparison with several open-source engines, in ESTIMATES.md (section "Release checks").

          Downloads: `x86-64-v3` needs a processor with AVX2 (most made since about 2013); `x86-64-v2` runs on older ones.

          The code is written by Claude (Anthropic's AI), directed and tested by Ayman Mikhail. Licence: GPL-3.0-or-later.
          EOF
          sed -i "s/VERSION/$VERSION/; s/BENCH/$bench/" notes.md
          cat notes.md
          gh release create --draft "v$VERSION" files/* --title "Trinity $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
